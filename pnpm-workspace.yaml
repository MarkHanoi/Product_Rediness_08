packages:
  - 'packages/*'
  - 'tools/*'
  - 'apps/*'
  - 'plugins/*'
  - 'tests/audit-log-s57'
  - 'tests/family-load-into-project'
  - 'tests/family-marketplace-publish'
  - 'tests/browser-matrix'
  - 'tests/s70-lifecycle-deletion'
  - 'tests/ga-gate'
  - 'tests/integration'
  - 'tests/commands'

# pnpm 10 reads overrides from this file (no longer from package.json#pnpm).
overrides:
  fast-xml-parser: 5.5.6
  handlebars: ^4.7.9
  three: ^0.183.2
  # Force all workspace packages to use versions not blocked by Replit's package firewall.
  # Older pinned versions in individual packages/* / plugins/* would be fetched at install
  # time and rejected with ERR_PNPM_FETCH_403.
  vitest: ^4.1.5
  "@vitest/coverage-v8": ^4.1.5
  happy-dom: ^20.11.1
  jsdom: ^29.1.1
  jspdf: ^4.2.1
  pdfjs-dist: ^5.6.205
  "svg2pdf.js": ^2.7.0
  uuid: ^13.0.0
  zod: ^4.3.6
  react: ^19.2.5
  react-dom: ^19.2.5

onlyBuiltDependencies:
  - esbuild
  - sharp
  - protobufjs
  - core-js
