# ─────────────────────────────────────────────────────────────────────────────
# terrain-bake.yml — bake per-city TERRAIN (Cesium quantized-mesh) → R2 (Phase 3)
#
# SEPARATE from context-bake.yml BY DESIGN. context-bake.yml owns the building/road/
# water/park PMTiles (osmium + tippecanoe, via a Docker toolchain). This workflow owns
# the ELEVATION half: `tools/context-bake/terrain.mjs` turns a national DTM raster into
# a Cesium quantized-mesh tileset per city and publishes it to
# `s3://pryzm-assets/tiles/terrain/<city>/`. The client attaches it with a
# CesiumTerrainProvider (apps/editor/.../CesiumViewport.ts maybeAttachTerrainProvider),
# which is what makes real ground RENDER under the massing in the 3D-Site view.
#
# WHY the split matters operationally: the height agent edits bake.mjs; terrain.mjs is a
# standalone module that does NOT import bake.mjs. Two workflows = no collision, no shared
# concurrency group, independent dispatch.
#
# TOOLCHAIN: pure Node — geotiff (read DTM) + @mapbox/martini (raster→TIN) + proj4 (the ONE
# shared horizontal-reprojection helper, reproject.mjs). NO Docker, NO GDAL (terrain.mjs
# implements the quantized-mesh encoder in-file). Deps install STANDALONE into
# tools/context-bake/node_modules (no package.json → NOT a pnpm workspace member; ephemeral
# in CI, gitignored), exactly as terrain.mjs's header prescribes.
#
# HONEST CURRENT STATE (2026-07-25): the per-country reprojection adapters are WIRED and
# live-verified for the keyless cities — amsterdam (NL AHN, RD-New closed form), barcelona/
# madrid/cordoba (ES PNOA MDT25), paris/lyon (FR RGE ALTI), zurich/geneva/bern (CH
# swissALTI3D), oslo (NO NHM), koln (DE NRW DGM1), rome/milan (IT TINITALY) and london (GB EA
# LIDAR). Each fetches its national DTM, reprojects native→WGS84 via reproject.mjs (proj4) and
# lifts orthometric→ellipsoidal (§L-584 datum). apikey-gated cities (copenhagen /
# stockholm / helsinki) and BLOCKED cities SKIP LOUDLY with a reason — no wrong-datum tileset
# is ever emitted. GB/CH bake a bounded centre box (source area caps / static COG tiles);
# full-city mosaics for those two are the documented follow-up.
#
# MANUAL ONLY. Founder clicks "Run workflow"; national DTMs change slowly.
# ─────────────────────────────────────────────────────────────────────────────

name: Bake terrain tiles → R2 (Phase 3)

on:
  workflow_dispatch:
    inputs:
      city:
        # §GEOID-REBAKE-IS-A-LIST (L-12977) — this said "a single city only", and that was never what
        # the loop below does: `CITIES="$CITY"` is word-split by `for c in $CITIES`, so a
        # space-separated list has ALWAYS worked. It went undocumented, so the §GEOID-PER-TILE-DATUM
        # re-bake list (348 cities ≥ 1 m of Z error) looked like 348 separate dispatches. It is one.
        description: 'Bake these cities — one slug, or a space-separated list (e.g. "tarifa ceuta algeciras"). Blank = every BAKEABLE region.'
        type: string
        default: ''
      geoid:
        # §GEOID-PER-TILE-DATUM (L-12975) — the mode WAS reachable (terrain.mjs defaults to egm08 and
        # this workflow passed no override) but it was not SELECTABLE, and an operator could neither
        # see which datum a run used nor reproduce a pre-fix tileset without editing the YAML. Both
        # are now explicit. `constant` is the pre-2026-09-06 per-COUNTRY lift and is byte-identical to
        # what is live today (proven in 3236cd41) — it exists to REPRODUCE a shipped tileset, never to
        # ship a new one.
        description: 'Vertical datum: egm08 = per-post EGM2008 N (correct). constant = the legacy per-COUNTRY geoidSepM (reproduces a pre-fix tileset).'
        type: choice
        options: [egm08, constant]
        default: egm08
      publish:
        description: 'Upload to s3://pryzm-assets/tiles/terrain/. Untick to bake + inspect the artifact only.'
        type: boolean
        default: true

concurrency:
  group: terrain-bake
  cancel-in-progress: false

jobs:
  bake:
    name: DTM → MARTINI TIN → quantized-mesh → R2
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install terrain compiler deps (in a TEMP dir OUTSIDE the repo)
        # A local package.json does NOT stop npm walking UP to the repo-root package.json, whose
        # `workspace:*` deps kill the install with EUNSUPPORTEDPROTOCOL (reproduced locally). The
        # only reliable escape is to install in a dir with NO workspace parent, then move
        # node_modules into tools/context-bake where terrain.mjs's `import('geotiff')` resolves it.
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          cd "$TMP"
          printf '{ "name": "pryzm-context-bake-standalone", "private": true, "version": "0.0.0" }\n' > package.json
          npm install --no-audit --no-fund geotiff@2 @mapbox/martini@0.2 @here/quantized-mesh-decoder@1 proj4@2
          rm -rf "$GITHUB_WORKSPACE/tools/context-bake/node_modules"
          mv node_modules "$GITHUB_WORKSPACE/tools/context-bake/node_modules"

      - name: Reproject self-test (proj4 control points) — fail the run before any bake if a def is wrong
        # reproject.mjs is the ONE shared horizontal projector for every non-NL city. Assert its
        # national CRS defs against known city control points + a <1 cm round-trip BEFORE baking, so a
        # bad def can never silently produce a mis-placed tileset.
        run: node tools/context-bake/terrain.mjs --selftest

      - name: Plan — source registry + per-city regions + live probe
        run: |
          set -euo pipefail
          node tools/context-bake/terrain.mjs --regions
          echo "── live source probe ──"
          node tools/context-bake/terrain.mjs --probe || true

      - name: Fetch the EGM2008 geoid grid ONCE (fail here, not 583 times mid-bake)
        # §GEOID-GRID-PREFETCH (L-12977). Under the default `--geoid egm08` EVERY city range-reads
        # https://cdn.proj.org/us_nga_egm08_25.tif for its own window. That is 583 reads of one 80 MB
        # artefact, and — worse — `resolveGeoidEvaluator` correctly THROWS on an unreachable grid, so a
        # CDN blip lands in the per-city `::warning::` tolerance below: that city is skipped, the run is
        # still green, and the OLD wrong-datum tileset stays live. A silently-kept defect is exactly the
        # failure this whole change exists to remove. So the grid is fetched ONCE, verified, and the
        # bake reads it from disk via `--geoid-tif`; if it cannot be fetched the RUN FAILS HERE, loudly.
        # ⛔ It is never substituted (EGM96 or a coarsened grid shifts every tile by decimetres with no
        # visible signal) and never degraded to `--geoid constant` — that is the bug, not the fallback.
        # The URL is asserted equal to terrain.mjs's own EGM08_COG_URL by geoidPerTileDatum.spec ARM H.
        run: |
          set -euo pipefail
          TIF="$RUNNER_TEMP/us_nga_egm08_25.tif"
          curl -sS -f -L --retry 3 --retry-delay 5 --max-time 900 -o "$TIF" https://cdn.proj.org/us_nga_egm08_25.tif
          sz="$(stat -c '%s' "$TIF")"
          magic="$(head -c 4 "$TIF" | od -An -tx1 | tr -d ' \n')"
          echo "EGM2008 grid: $sz bytes, magic $magic"
          # 80,585,622 B is the published size; accept only a plausible full file with TIFF magic
          # (II*\0 little-endian or MM\0* big-endian), so a truncated/HTML error page can never be
          # read as a geoid and lift every post by a garbage N.
          [ "$sz" -gt 80000000 ] || { echo "::error::EGM2008 grid is $sz bytes — truncated; refusing to bake on a partial geoid."; exit 1; }
          case "$magic" in 49492a00|4d4d002a) ;; *) echo "::error::EGM2008 grid is not a TIFF (magic $magic)"; exit 1 ;; esac
          echo "GEOID_TIF=$TIF" >> "$GITHUB_ENV"

      - name: Bake
        env:
          # apikey-gated sources (used once their fetch/reproject adapters land). DK reuses the
          # Matrikel key. ⚠ If any of these is only a FLY secret, add it as a REPO secret too or
          # the CI bake for that city cannot authenticate. Amsterdam (the wired city) is keyless.
          DATAFORDELER_API_KEY: ${{ secrets.DATAFORDELER_API_KEY }}
          LANTMATERIET_API_KEY: ${{ secrets.LANTMATERIET_API_KEY }}
          MML_API_KEY: ${{ secrets.MML_API_KEY }}
          CITY: ${{ inputs.city }}
          GEOID: ${{ inputs.geoid }}
        run: |
          set -euo pipefail
          echo "vertical datum for this run: --geoid $GEOID (grid $GEOID_TIF)"
          if [ -n "$CITY" ]; then
            CITIES="$CITY"
          else
            # Every bakeable (non-blocked) city, from the single source of truth.
            CITIES="$(node -e "import('./tools/context-bake/terrain.mjs').then(m => console.log(m.BAKEABLE_REGIONS.map(r => r.name).join(' ')))")"
          fi
          echo "cities to attempt: $CITIES"
          # Per-city fault tolerance: a multi-city bake must NOT be all-or-nothing. One city's
          # fetch/skip failure (a gated apikey city, or an upstream server quirk) must not throw
          # away every city that DID bake. Capture failures as warnings; the Assert step below
          # then validates whatever real tilesets were produced, and Publish uploads them.
          failed=""
          for c in $CITIES; do
            echo "── $c ──"
            if ! node tools/context-bake/terrain.mjs --bake-city "$c" --out "tools/context-bake/out/terrain/$c" \
                 --geoid "$GEOID" --geoid-tif "$GEOID_TIF"; then
              echo "::warning::terrain bake for '$c' failed — skipping (other cities continue)"
              failed="$failed $c"
            fi
          done
          # §GEOID-REBAKE-IS-A-LIST (L-12977) — a skipped city KEEPS ITS OLD TILESET. When the point of
          # the run is to correct a datum, "skipped" and "corrected" must never read the same, so the
          # names are echoed twice: once as a warning and once in the step summary the founder reads.
          [ -n "$failed" ] && echo "::warning::cities that did not bake (they KEEP their previous tileset):$failed" || echo "all attempted cities baked"
          { echo "### Bake ($GEOID)"; echo ""; echo "attempted: \`$CITIES\`"; echo ""; echo "did NOT bake (kept their old tileset): \`${failed:- none}\`"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Assert produced tilesets are real
        run: |
          set -euo pipefail
          cd tools/context-bake/out
          if [ ! -d terrain ] || [ -z "$(ls -A terrain 2>/dev/null)" ]; then
            echo "::warning::no terrain/ tilesets were produced — every attempted city skipped (apikey/blocked). Unexpected for the keyless cities; check the bake log for the per-city reason."
            exit 0
          fi
          fail=0
          for d in terrain/*/; do
            city="$(basename "$d")"
            if [ ! -f "$d/layer.json" ]; then
              echo "::error::$city has no layer.json — compile produced no tileset."
              fail=1; continue
            fi
            # At least one quantized-mesh LOD, non-trivial size (an empty encode is a few bytes).
            n="$(find "$d" -name '*.terrain' 2>/dev/null | wc -l)"
            sz="$(find "$d" -name '*.terrain' -printf '%s\n' 2>/dev/null | sort -n | tail -1)"; sz="${sz:-0}"
            echo "$city — $n .terrain LODs, largest $sz bytes, layer.json OK"
            if [ "$n" -lt 1 ] || [ "$sz" -lt 128 ]; then
              echo "::error::$city produced no real quantized-mesh tiles."
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1

      - name: Round-trip proof (independent decoder) + placement/datum sample
        # The encoder is hand-rolled, so a tileset is only trustworthy if a decoder we did NOT write
        # reads it back. Amsterdam uses its local-tif verify; every baked non-NL city is re-fetched +
        # warped + decoded via `--city`, which ALSO prints control-point elevations (coast/valley →
        # hill) so a wrong datum or mis-projection is visible, not just a clean decode.
        run: |
          set -euo pipefail
          cd tools/context-bake
          # Validate the ACTUAL emitted tiles on disk — no re-fetch, no apikey needed (so apikey cities
          # like copenhagen are proven too). --tileset parses layer.json, asserts every declared
          # {z}/{x}/{y}.terrain exists, and independently decodes the root + finest tiles. This proves
          # exactly what we are about to PUBLISH, not a freshly re-baked copy.
          fail=0
          for d in out/terrain/*/; do
            city="$(basename "$d")"
            echo "── $city (tileset decode proof) ──"
            node terrain.verify.mjs --tileset "$d" || { echo "::error::$city failed the tileset decode proof"; fail=1; }
          done
          [ "$fail" -eq 0 ] || exit 1

      - name: Upload tilesets as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: terrain-tilesets
          path: tools/context-bake/out/terrain/**
          retention-days: 14
          if-no-files-found: warn

      - name: Publish to R2
        if: ${{ inputs.publish }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
          AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ ! -d tools/context-bake/out/terrain ] || [ -z "$(ls -A tools/context-bake/out/terrain 2>/dev/null)" ]; then
            echo "nothing to publish — no tilesets produced this run."
            exit 0
          fi
          if [ -z "${R2_ACCOUNT_ID}" ] || [ -z "${AWS_ACCESS_KEY_ID}" ]; then
            echo "::error::R2_* repo secrets are not set — cannot publish. (The artifact above is still valid.)"
            exit 1
          fi
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          # Two passes so each object carries the right content-type. Terrain tiles are served
          # whole (Cesium fetches each .terrain in full — no HTTP Range requirement, unlike PMTiles).
          # A 1-day cache lets a re-bake propagate (per-city path is stable, so we do NOT use the
          # immutable/path-change scheme PMTiles uses).
          aws s3 sync tools/context-bake/out/terrain "s3://pryzm-assets/tiles/terrain" \
            --endpoint-url "$ENDPOINT" --no-progress \
            --exclude '*' --include '*.terrain' \
            --content-type 'application/vnd.quantized-mesh' \
            --cache-control 'public, max-age=86400'
          aws s3 sync tools/context-bake/out/terrain "s3://pryzm-assets/tiles/terrain" \
            --endpoint-url "$ENDPOINT" --no-progress \
            --exclude '*' --include 'layer.json' --include '*/layer.json' \
            --content-type 'application/json' \
            --cache-control 'public, max-age=86400'
          echo "── bucket after publish ──"
          # `| head` under `set -o pipefail` makes aws's SIGPIPE fail the whole (successful) publish.
          # Make this cosmetic listing non-fatal so a good sync is never thrown away by the summary.
          { aws s3 ls "s3://pryzm-assets/tiles/terrain/" --endpoint-url "$ENDPOINT" --recursive --human-readable || true; } | head -50 || true

      - name: Verify a tileset is publicly readable
        if: ${{ inputs.publish }}
        env:
          # §TERRAIN-PROBE-ABSOLUTE-ORIGIN (L-12968) — this used to default to
          # `vars.VITE_CONTEXT_TILES_URL`, which in this repo is the SAME-ORIGIN PROXY PATH
          # `/api/context-tiles/` (see tools/deploy/fly-bundle-proof.sh, which asserts exactly that
          # value). curl cannot fetch a relative URL, so the probe built
          # `/api/context-tiles/terrain/<city>/layer.json`, got a non-200, and FAILED THE RUN — four
          # times (34015785661, 34019409317, 34023835778, 34026922198) while every one of those runs
          # had published correct tiles to R2. A step that cries wolf trains everyone to ignore it,
          # and it nearly cost us the real Hague/Eindhoven defects, which were found by reading R2.
          # R2 is the thing this job actually wrote, so R2 is what it verifies. The prod proxy is a
          # SEPARATE axis (it needs a deploy) and is probed below as INFORMATION, never as a gate.
          R2_BASE: https://pub-1ad4f6c5dec849b5b25a45586898fd4d.r2.dev/tiles/
          PROXY_BASE: ${{ vars.VITE_CONTEXT_TILES_URL || '' }}
        run: |
          set -euo pipefail
          # Verify whatever city we actually baked (prefer amsterdam). Terrain does NOT need 206 —
          # Cesium reads each .terrain whole — so a plain 200 on layer.json is the success signal.
          CITY="amsterdam"
          if [ ! -d "tools/context-bake/out/terrain/$CITY" ]; then
            CITY="$(basename "$(ls -d tools/context-bake/out/terrain/*/ 2>/dev/null | head -1)")" || true
          fi
          if [ -z "$CITY" ]; then echo "no city to verify (none baked)."; exit 0; fi

          URL="${R2_BASE%/}/terrain/$CITY/layer.json"
          echo "probing $URL"
          code=000
          for attempt in 1 2 3 4 5; do
            code="$(curl -s -o /tmp/layer.json -w '%{http_code}' -L --max-time 60 "$URL" || true)"
            [ "$code" = "200" ] && break
            echo "  attempt $attempt → HTTP $code; object-store propagation can lag a sync, retrying in 10 s"
            sleep 10
          done
          echo "HTTP $code (expected 200)"
          if [ "$code" != "200" ]; then
            echo "::error::$URL returned $code after 5 attempts — uploaded but not publicly served. Fix in the Cloudflare R2 dashboard (Public access), and ensure connect-src allows the tiles origin (server/securityHeaders.js)."
            exit 1
          fi
          echo "✓ terrain/$CITY is public — CesiumTerrainProvider.fromUrl will resolve it."

          # §NL-CITY-BBOX (L-12942) + §NL-CITY-DEPTH (L-12943) — a tileset that is SERVED can still be
          # wrong: thehague shipped a stale AMSTERDAM patch and eindhoven shipped 76 m posts, and both
          # passed a plain 200. Assert the published header actually describes THIS city's bake.
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("/tmp/layer.json", "utf8"));
            const zmax = (m.available || []).length - 1;
            const b = m.bounds;
            const post = (180 / 2 ** zmax) / 256 * 111320;
            console.log(`  published header: zmax=${zmax} (~${post.toFixed(1)} m posts) bounds=${JSON.stringify(b)}`);
            if (!Array.isArray(b) || b.length !== 4) { console.log("::error::published layer.json has no usable bounds"); process.exit(1); }
            if (!(zmax >= 1)) { console.log("::error::published layer.json declares no tile levels"); process.exit(1); }
          '

          # INFORMATION ONLY — the prod proxy serves the SAME R2 objects but only after a deploy, so a
          # non-200 here is a deploy-state fact, never a reason to fail a bake that published fine.
          if [ -n "$PROXY_BASE" ]; then
            case "$PROXY_BASE" in
              /*) PROXY_URL="https://pryzm.fly.dev${PROXY_BASE%/}/terrain/$CITY/layer.json" ;;
              *)  PROXY_URL="${PROXY_BASE%/}/terrain/$CITY/layer.json" ;;
            esac
            pcode="$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 60 "$PROXY_URL" || true)"
            echo "prod proxy $PROXY_URL → HTTP $pcode (informational; a deploy may be pending)"
          fi

      - name: What to do next
        if: ${{ success() && inputs.publish }}
        run: |
          {
            echo "### Terrain tiles published ✅"
            echo ""
            echo "Live under \`pryzm-assets/tiles/terrain/<city>/\`. The client "
            echo "(\`CesiumViewport.maybeAttachTerrainProvider\`) attaches them automatically for any "
            echo "site inside a baked city bbox — no code change needed."
            echo ""
            echo "**Wired end-to-end (keyless):** amsterdam, barcelona, madrid, cordoba, paris, lyon,"
            echo "zurich, geneva, bern, oslo, koln, rome, milan, london — each reprojected via"
            echo "\`reproject.mjs\` (proj4) + orthometric→ellipsoidal datum lift. (gb/ch bake a bounded"
            echo "centre box — full-city mosaics are the follow-up.)"
            echo "**apikey cities (skip until a REPO secret is added):** copenhagen (DATAFORDELER_API_KEY),"
            echo "stockholm (LANTMATERIET_API_KEY), helsinki (MML_API_KEY)."
            echo "**blocked:** lisbon/porto (PT), brussels (BE), berlin/munich (DE non-NRW), riyadh/jeddah (SA)."
          } >> "$GITHUB_STEP_SUMMARY"
