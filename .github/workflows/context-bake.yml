# ─────────────────────────────────────────────────────────────────────────────
# context-bake.yml — bake the 3D-Site context to PMTiles and publish to R2 (L-513a)
#
# THE PROBLEM THIS RETIRES. The 3D-Site context (surrounding buildings/roads/
# water/parks) is fetched at runtime from the PUBLIC Overpass API. That is the
# last unreliable dependency on the demo critical path, and it fails in ways no
# amount of client code can fix: 406s, 45-second hangs, 429 rate limits, 504s,
# "ALL upstream mirrors failed", and — the nastiest one (L-469) — errors reported
# IN-BAND as HTTP 200 with a `remark` field, i.e. an empty result that is
# indistinguishable from "there is genuinely nothing here".
# See docs/04-reference/CONTEXT-3D-PERFORMANCE-ARCHITECTURE.md §8/§9.
#
# THE FIX. Pre-bake the same data, offline and deterministically, from Geofabrik's
# daily Cataluña extract into static PMTiles, and serve them from R2 over HTTP
# range requests. A tile read becomes a CDN byte-range fetch (<50 ms) with no
# third-party availability in the loop.
#
# WHAT RUNS. `tools/context-bake/bake.mjs` — already built and documented:
#   download .osm.pbf (~266 MB) → osmium extract (Barcelona bbox)
#   → osmium tags-filter → osmium export (GeoJSONSeq) → tippecanoe → *.pmtiles
# The toolchain (osmium-tool + the felt tippecanoe fork) is NOT on the runner and
# tippecanoe is not packaged for Debian, so we build the tool's OWN Dockerfile and
# let bake.mjs's existing Docker fallback drive it. That keeps CI running the
# exact same toolchain a developer runs locally — no second, drifting recipe.
#
# MANUAL ONLY, BY DESIGN. The source refreshes daily but the city does not; a
# scheduled bake would burn ~15 min of runner time to republish near-identical
# tiles. The founder clicks "Run workflow" when the context should be refreshed.
# ─────────────────────────────────────────────────────────────────────────────

name: Bake context tiles → R2 (L-513a)

on:
  workflow_dispatch:
    inputs:
      layer:
        description: 'Bake a single layer only (buildings | roads | water | parks | landuse). Blank = all.'
        type: string
        default: ''
      publish:
        description: 'Upload the result to s3://pryzm-assets/tiles/. Untick to bake and only inspect the artifact.'
        type: boolean
        default: true

concurrency:
  group: context-bake
  cancel-in-progress: false

jobs:
  bake:
    name: osmium + tippecanoe → PMTiles → R2
    runs-on: ubuntu-latest
    # §L-607 multi-region — was 90 (Barcelona only). Whole-Spain (national) + ~17 city clips across
    # ~13 country extracts means ~10 GB of downloads (reclaimed as we go — see bake.mjs --keep-pbf)
    # plus a whole-Spain tippecanoe pass, so 180 gives the download + cold tippecanoe compile +
    # national tiling room without hanging all day.
    timeout-minutes: 180
    # ─────────────────────────────────────────────────────────────────────────
    # §HEIGHT-STAMP-BUDGET (L-659, 2026-08-01) — RAISE THE NODE HEAP FOR EVERY
    # STEP IN THIS JOB.
    #
    # Run 30693132326 died 23 minutes in with
    #   FATAL ERROR: Ineffective mark-compacts near heap limit  (exit 134)
    #   Mark-Compact 4045.6 (4131.0) -> 4039.9 (4141.8) MB
    # i.e. exactly at V8's DEFAULT ~4 GB old-space, on the whole-Spain height
    # join. `ubuntu-latest` has 16 GB of RAM and this workflow set NO
    # NODE_OPTIONS, so Node was using a quarter of the machine.
    #
    # ⚠ THIS IS THE SMALLER HALF OF THE FIX, AND ON ITS OWN IT WOULD NOT HAVE
    # WORKED. A parsed OSM footprint costs ~1.26 kB of V8 heap (measured —
    # tools/context-bake/__tests__/geojsonseqRead.spec.ts), so a national
    # footprint set wants >10 GB; 12 GB would have moved the cliff, not removed
    # it. The REAL fix is the bounded working set in heightSources.mjs
    # (§JOIN-BOUNDED-WORKING-SET) — only footprints inside a region's declared
    # stamp bboxes are held; the rest stream through. This setting is the
    # headroom that makes that comfortable, and `bake.mjs --check` now FAILS in
    # the Plan step below if it is missing (§HEIGHT-STAMP-BUDGET preflight).
    #
    # 12 GB, not 14: docker (osmium/tippecanoe) and the page cache for a
    # multi-GB GeoJSONSeq need the rest of the 16 GB.
    # ─────────────────────────────────────────────────────────────────────────
    env:
      NODE_OPTIONS: --max-old-space-size=12288
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Free disk space
        run: |
          # The bake needs ~2 GB of scratch (266 MB pbf + clip + per-layer pbf +
          # GeoJSONSeq, which is by far the largest intermediate). The hosted image
          # ships several GB of preinstalled toolchains this job will never use.
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      - name: Build the bake toolchain image
        # Bundles osmium-tool + the felt tippecanoe fork. bake.mjs auto-detects that
        # the local binaries are absent and shells out to this image, mounting
        # tools/context-bake/out at /work. Compiling tippecanoe is the slow part
        # (a few minutes) and is why this is not an every-push job.
        run: docker build -t pryzm-context-bake tools/context-bake

      - name: Provision the height-join dependency (geotiff)
        # §PHASE1-HEIGHTS — the national REAL-height joins (ES CNIG MDS Edificación mdsn_e025; DK DHM
        # nDSM) decode the WCS GeoTIFF rasters in bake.mjs's HOST Node process, via heightSources.mjs's
        # lazy `import('geotiff')`. geotiff is NOT an osmium/tippecanoe/DuckDB binary (those ride the
        # Docker image), so it must be on the RUNNER's Node resolution path — nothing else installs it.
        # Absent it, loadGeoTiff() returns null → the MDS/DHM join returns `documented` → the region
        # ships the honest OSM 9 m default (NO real heights; never a fabricated one).
        #
        # WHY NOT just `npm install` here (the pre-cb500dbb attempt, which failed EUNSUPPORTEDPROTOCOL):
        # npm cannot run ANYWHERE inside the repo. The root package.json declares an npm-style
        # `"workspaces": ["tools/*", …]`, so npm — even with working-directory: tools/context-bake —
        # walks UP to the workspace root and reads its `workspace:*` specifiers, a pnpm-only protocol
        # npm rejects with `Unsupported URL Type "workspace:"`. And we must NOT drop a package.json under
        # tools/context-bake to stop that walk-up: `tools/*` is ALSO a pnpm workspace glob, so a new
        # package.json there becomes a real workspace member and drifts pnpm-lock.yaml → breaks every
        # other job's `pnpm install --frozen-lockfile` (the frozen-lockfile landmine).
        #
        # So install into an isolated scratch project OUTSIDE the repo (its own package.json, no
        # workspaces field, no repo .npmrc in scope), then copy the resolved tree into
        # tools/context-bake/node_modules — where Node ESM resolves the host-process `import('geotiff')`
        # by walking node_modules up from the importing module. (NODE_PATH is CommonJS-only and would NOT
        # satisfy an ESM bare-specifier import.) Pinned to the version the join was live-verified against
        # (heightSources.mjs §mds_edificacion).
        run: |
          set -euo pipefail
          HOSTDIR="${RUNNER_TEMP:-/tmp}/geotiff-host"
          rm -rf "$HOSTDIR"; mkdir -p "$HOSTDIR"
          printf '{"name":"pryzm-geotiff-host","private":true}\n' > "$HOSTDIR/package.json"
          ( cd "$HOSTDIR" && npm install --no-package-lock geotiff@2.1.3 )
          DEST="$GITHUB_WORKSPACE/tools/context-bake/node_modules"
          mkdir -p "$DEST"
          cp -R "$HOSTDIR/node_modules/." "$DEST/"
          # Fail loud here, not silently as a `documented` no-height 40 minutes into the bake, if the
          # host process cannot actually resolve the dep it will lazy-import.
          ( cd "$GITHUB_WORKSPACE/tools/context-bake" \
            && node --input-type=module -e "const m=await import('geotiff'); if(typeof m.fromArrayBuffer!=='function'){console.error('geotiff.fromArrayBuffer missing');process.exit(1)} console.log('✓ geotiff resolvable from the bake host process (fromArrayBuffer ok)')" )

      # §HEIGHT-STAMP-BUDGET (L-659) — this is now a GATE, not just a printout. `--check` asserts, in
      # ~2 ms and before a single byte is downloaded, that (a) every whole-country region declaring a
      # height join also declares a BOUNDED set of stamp bboxes, and (b) NODE_OPTIONS gives the heap
      # those bboxes need. Both were false on run 30693132326, which found out 23 minutes later via a
      # V8 abort that named no region. Exit 5 = budget failure; read the step log, it says which.
      - name: Plan + height-stamp budget preflight (fails fast, before any download)
        run: node tools/context-bake/bake.mjs --check

      - name: Bake
        env:
          LAYER: ${{ inputs.layer }}
          # DK Copenhagen REAL building heights: heightSources.mjs derives DHM nDSM (DSM−DTM) behind this
          # apikey. Absent → resolveHeights('copenhagen') returns `blocked` and the region keeps OSM
          # (honest 9 m default) — never a fabricated height. (Mirror of terrain-bake.yml's threading.)
          DATAFORDELER_API_KEY: ${{ secrets.DATAFORDELER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$LAYER" ]; then
            node tools/context-bake/bake.mjs --layer "$LAYER"
          else
            node tools/context-bake/bake.mjs
          fi

      - name: Assert the tiles are real
        run: |
          set -euo pipefail
          cd tools/context-bake/out
          ls -lh *.pmtiles
          # A zero-byte or few-KB .pmtiles means tippecanoe produced an empty tileset
          # (bad filter, bad bbox, truncated download). It would upload happily and
          # then render as "no context" — the exact failure we are replacing. Catch
          # it here, where the log still says why.
          fail=0
          for f in *.pmtiles; do
            sz=$(stat -c %s "$f")
            echo "$f — $sz bytes"
            if [ "$sz" -lt 51200 ]; then
              echo "::error::$f is only $sz bytes — the bake produced an effectively empty tileset."
              fail=1
            fi
            # PMTiles v3 files start with the magic string "PMTiles".
            if [ "$(head -c 7 "$f")" != "PMTiles" ]; then
              echo "::error::$f does not carry the PMTiles magic header."
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1

      # ─────────────────────────────────────────────────────────────────────────
      # §MEASURED-HEIGHT-GATE (L-658) — assert PROVENANCE, not just plumbing.
      #
      # WHY THIS STEP EXISTS. On 2026-08-01 (run 30687958478) every step above was
      # green and the bake published a 2.3 GB buildings.pmtiles in which Barcelona,
      # Köln AND Copenhagen carried ZERO measured heights — 62.5 % of Barcelona's
      # skyline was the fabricated 9 m default. "Assert the tiles are real" passed
      # because it only checks each file's SIZE (>50 KB) and its PMTiles magic
      # header. SIZE IS NOT PROVENANCE: a tileset full of fabricated heights is
      # large, well-formed, and completely wrong.
      #
      # The three joins had in fact all failed — two threw on V8's 512 MiB string
      # cap, one could not parse osmium's RFC 8142 record separator — and each
      # degraded SILENTLY to the OSM default, which the pipeline reported as
      # success. This step reads the tileset we just built (before publishing it)
      # and fails the run unless the cities that CLAIM measured heights have them.
      # `derived-levels` deliberately does not count as measured.
      # ─────────────────────────────────────────────────────────────────────────
      - name: Assert the baked heights are MEASURED (not fabricated)
        if: ${{ inputs.layer == '' || inputs.layer == 'buildings' }}
        run: |
          set -euo pipefail
          # The probe borrows the CLIENT'S OWN tile decoders, resolved from apps/editor.
          # Provision them the same isolated way as geotiff above — a plain `npm`/`pnpm`
          # install inside the repo hits the workspace landmine documented on that step.
          HOSTDIR="${RUNNER_TEMP:-/tmp}/probe-host"
          rm -rf "$HOSTDIR"; mkdir -p "$HOSTDIR"
          printf '{"name":"pryzm-probe-host","private":true}\n' > "$HOSTDIR/package.json"
          ( cd "$HOSTDIR" && npm install --no-package-lock pmtiles@4.4.1 @mapbox/vector-tile@3.0.3 pbf@5.1.2 )
          DEST="$GITHUB_WORKSPACE/apps/editor/node_modules"
          mkdir -p "$DEST"
          cp -R "$HOSTDIR/node_modules/." "$DEST/"

          TILES="$GITHUB_WORKSPACE/tools/context-bake/out/buildings.pmtiles"
          fail=0
          # Each row: name + lat,lon + the minimum number of MEASURED footprints required.
          # These are the cities whose region declares a national height join, so a zero
          # here means the join silently produced nothing — exactly the 2026-08-01 defect.
          while read -r name at min; do
            [ -z "$name" ] && continue
            echo "── $name"
            node tools/context-height-probe/probe.mjs \
              --pmtiles "$TILES" --at "$at" --name "$name" --require-measured "$min" || fail=1
          done <<'CITIES'
          barcelona 41.3888,2.1590 500
          koln 50.9375,6.9603 500
          CITIES
          if [ "$fail" -ne 0 ]; then
            echo "::error::A city that declares a national height join shipped ZERO (or too few) measured heights. The tileset would render a fabricated 9 m carpet. NOT publishing."
            exit 1
          fi

      - name: Upload the tiles as a run artifact
        # Kept regardless of publishing: it makes a bake inspectable/diffable after
        # the fact, and gives a rollback source if a later bake regresses.
        uses: actions/upload-artifact@v4
        with:
          name: context-pmtiles
          path: tools/context-bake/out/*.pmtiles
          retention-days: 14
          if-no-files-found: error

      - name: Publish to R2
        if: ${{ inputs.publish }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 does not implement the aws CLI v2 default checksum/streaming behaviours;
          # without these an upload fails with an opaque signature error.
          AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
          AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${R2_ACCOUNT_ID}" ] || [ -z "${AWS_ACCESS_KEY_ID}" ]; then
            echo "::error::R2_* repo secrets are not set — cannot publish. (The bake artifact above is still valid.)"
            exit 1
          fi
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          # NOTE ON CACHING (decision record §Caching): PMTiles are served with a
          # 1-year immutable TTL, which means clients will NOT re-check them. A
          # re-bake therefore has to change the PATH to be seen. `--exclude '*'
          # --include '*.pmtiles'` keeps every intermediate (.osm.pbf, .geojsonseq —
          # gigabytes) out of the bucket; only the four tilesets go up.
          aws s3 sync tools/context-bake/out "s3://pryzm-assets/tiles" \
            --endpoint-url "$ENDPOINT" \
            --no-progress \
            --exclude '*' --include '*.pmtiles' \
            --content-type 'application/vnd.pmtiles' \
            --cache-control 'public, max-age=31536000, immutable'

          echo "── bucket after publish ──"
          aws s3 ls "s3://pryzm-assets/tiles/" --endpoint-url "$ENDPOINT" --human-readable

      - name: Verify a tileset is publicly readable AND range-servable
        if: ${{ inputs.publish }}
        env:
          PUBLIC_BASE: ${{ vars.VITE_CONTEXT_TILES_URL || 'https://pub-1ad4f6c5dec849b5b25a45586898fd4d.r2.dev/tiles/' }}
        run: |
          set -euo pipefail
          # §CONTEXT-CACHE-BUST — probe the EXACT URL the browser will request, cache-bust
          # stamp included. `<layer>.pmtiles` is path-stable across re-bakes and is published
          # `immutable, max-age=31536000`, so a client that read the previous tileset only ever
          # sees this one because `?v=` changed. Reading the bare path here would verify a URL
          # nobody requests — the "probe the wrong SYSTEM" trap. One constant, one source:
          # apps/editor/src/ui/geospatial/contextTiles.ts, the same file the probe reads.
          VER="$(sed -n "s/^export const CONTEXT_TILESET_VERSION = '\([^']*\)';/\1/p" \
                 "$GITHUB_WORKSPACE/apps/editor/src/ui/geospatial/contextTiles.ts" | head -1)"
          if [ -z "$VER" ]; then
            echo "::error::Could not read CONTEXT_TILESET_VERSION from contextTiles.ts — the client's cache-bust stamp is the only thing that makes a re-bake visible."
            exit 1
          fi
          echo "client cache-bust stamp: v=$VER"
          echo "### Context tileset \`v=$VER\` published" >> "$GITHUB_STEP_SUMMARY"

          # PMTiles is USELESS without HTTP Range support — the client reads a byte
          # range per tile and never downloads the whole file. A 200 here would mean
          # the host ignored the Range header and would be a silent, catastrophic
          # regression to full-file downloads. We require 206 Partial Content.
          URL="${PUBLIC_BASE%/}/buildings.pmtiles?v=$VER"
          echo "probing $URL"
          code="$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 60 -H 'Range: bytes=0-127' "$URL")"
          echo "HTTP $code (expected 206)"
          if [ "$code" = "206" ]; then
            echo "✓ tiles are public and range-servable — ready for the client reader (L-513b)."
          elif [ "$code" = "200" ]; then
            echo "::error::$URL served 200, not 206 — the host is ignoring Range requests. PMTiles needs 206."
            exit 1
          else
            echo "::error::$URL returned $code — objects uploaded but not publicly served."
            echo "  Fix in the Cloudflare dashboard: R2 → pryzm-assets → Settings → Public access."
            exit 1
          fi

      - name: What to do next
        if: ${{ success() && inputs.publish }}
        run: |
          {
            echo "### Context tiles published ✅"
            echo ""
            echo "Tiles are live under \`pryzm-assets/tiles/\`."
            echo ""
            echo "**Next (L-513b, a separate code change):** the client tile reader does not exist yet —"
            echo "the app still uses live Overpass. Do NOT set the \`VITE_CONTEXT_TILES_URL\` repo variable"
            echo "until the reader ships, or the build will bake a base URL nothing reads."
          } >> "$GITHUB_STEP_SUMMARY"
