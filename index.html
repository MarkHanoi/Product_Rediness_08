<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PRYZM 3 — Browser-native BIM/AEC editor. Plugin-extensible, IFC, real-time collaboration, AI-assisted, offline-capable." />
    <meta name="theme-color" content="#1e3a5f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PRYZM" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/pryzm-pyramid-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" />
    <title>PRYZM 3 — BIM Editor</title>
    <style>
      /* S70 D7 — a11y tokens per ADR-0052 §B.2.  Inline-duplicated
         from @pryzm/ui/src/a11y/tokens.ts so the boot shell carries
         the skip-link CSS even before the editor bundle resolves. */
      .skip-link {
        position: absolute; left: -9999px; top: 4px; z-index: 100001;
        background: #3a7bd5; color: #fff; padding: 8px 16px; border-radius: 4px;
        font: 600 14px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif;
        text-decoration: none;
      }
      .skip-link:focus, .skip-link:focus-visible {
        left: 8px; outline: 2px solid #fff; outline-offset: 2px;
      }
      :focus-visible { outline: 2px solid #3a7bd5; outline-offset: 2px; }
      .sr-only {
        position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
      }
    </style>
    <style>
      body { margin: 0; padding: 0; overflow: hidden; width: 100vw; height: 100vh; background: #e8edf6; }
      /* Phase 1.1 — Docking Layout: dck-workspace is the top-level flex row that
         contains left-dock / #container / right-dock so pinned panels push the
         Three.js canvas inward instead of overlapping it. */
      #dck-workspace {
        position: absolute; inset: 0; display: flex; flex-direction: row; overflow: hidden; z-index: 0;
      }
      #dck-left-dock  {
        flex-shrink: 0; width: 0; height: 100%; overflow: hidden;
        transition: width 0.25s cubic-bezier(0.4,0,0.2,1); display: flex; flex-direction: column;
      }
      #dck-right-dock {
        flex-shrink: 0; width: 0; height: 100%; overflow: hidden;
        transition: width 0.25s cubic-bezier(0.4,0,0.2,1); display: flex; flex-direction: column;
      }
      /* §VIEWPORT-BG-ONE-AUTHORITY (2026-08-08) — #container is the 3D VIEWPORT
         host: the PRYZM overlay canvas is appended here (initScene OVERLAY_CSS,
         z-index:2) and is cleared TRANSPARENT on the WebGPU/TSL path, so whatever
         paints here is what the user sees as "the background of the 3D view".
         It was #e8edf6 — the app-CHROME colour (`--app-bg`) — which is a light
         blue-grey, not the scene background. It must mirror LIGHT_BG_HEX in
         packages/renderer-three/src/pipeline/BackgroundUniform.ts (the single
         authority); this literal is the ONE copy that cannot import it, because
         this CSS is parsed before any module evaluates. Keep them in lock-step. */
      #container { flex: 1 1 0; min-width: 0; height: 100%; position: relative; background: #ffffff; }
      bim-viewport { display: block; width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
    </style>
    <!--
      ── App-Shell critical CSS (Wave 1.5 paint-on-first-byte) ────────────────
      Above-the-fold landing skeleton — painted before any JS executes so the
      user never sees a blank pale-blue body while Vite resolves the ~233-module
      plugin graph in dev mode.  Class names match `src/styles/panels/marketingPages.ts`
      so the swap to the real `LandingPage` is visually seamless.

      Discipline note: §05 §2.1 ("injectAppTheme is the sole CSS injection point")
      governs *runtime* JS-managed CSS.  This block is the boot shell — it cannot
      be JS-injected because its purpose is to paint *before* JS runs.  Identifier
      prefix `lp-skel-` avoids any class-name collision with the real landing.

      Authoring rule: keep this block under ~3 KB (uncompressed).  Above-the-fold
      only; everything below the fold renders via the full LandingPage swap.
    -->
    <style>
      :root {
        --lp-skel-gradient: linear-gradient(135deg, #8B5CF6 0%, #6600FF 100%);
        --lp-skel-font: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      /* PRYZM4 boot skeleton — mirrors the lp4-mesh-flow animated gradient.
         Pure CSS static approximation (no @property here; those require
         injectAppTheme to be already loaded). Uses a compound radial-gradient
         that closely matches the 0% keyframe of lp4-mesh-flow so the swap
         from skeleton → real LandingPage is visually seamless. */
      .lp-skel-shell {
        position: fixed; inset: 0;
        background:
          radial-gradient(ellipse 90% 70% at 5% 55%, #c8b6ff 0%, transparent 65%),
          radial-gradient(ellipse 70% 60% at 92% 18%, #b8a2ff 0%, transparent 58%),
          radial-gradient(ellipse 65% 55% at 72% 90%, #daceff 0%, transparent 55%),
          radial-gradient(ellipse 55% 45% at 40% 5%, #ece7ff 0%, transparent 50%),
          #f3f0ff;
        display: flex; flex-direction: column;
        font-family: var(--lp-skel-font); color: #1a2035; overflow: hidden; z-index: 10;
      }
      /* §SKEL-MATCH — this header's geometry must mirror `.lp-nav`,
         `.lp-nav-links` and `.lp-nav-actions` in marketingPages.ts EXACTLY
         (memory: landing-skeleton-vs-real-mismatch.md), or the header
         visibly re-lays-out when the real LandingPage swaps in. */
      .lp-skel-nav {
        display: flex; align-items: center; gap: 16px; position: relative;
        padding: 0 18px; min-height: 64px; background: #6600FF; flex-shrink: 0;
        box-shadow: 0 1px 0 rgba(255,255,255,0.16), 0 6px 20px rgba(40,0,110,0.18);
      }
      .lp-skel-brand { display: flex; align-items: center; gap: 14px; flex-shrink: 0; min-width: 151px; margin-right: auto; }
      .lp-skel-logo-icon { width: 48px; height: 48px; display: block; flex-shrink: 0; overflow: visible; }
      .lp-skel-wordmark { display: flex; flex-direction: column; gap: 3px; flex-shrink: 0; }
      .lp-skel-name {
        font-size: 20px; font-weight: 700; letter-spacing: 4px; color: #ffffff; line-height: 1;
      }
      /* Centred nav pill — mirrors `.lp-nav-links`, including its two-stage
         centring (in-flow by default, absolutely centred only ≥1200px). */
      .lp-skel-nav-links {
        display: flex; align-items: center; gap: 2px; flex: 0 0 auto; margin: 0 auto;
        padding: 4px 6px;
        background: rgba(255,255,255,0.13);
        backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
        border: 1px solid rgba(255,255,255,0.24); border-radius: 999px;
      }
      @media (min-width: 1200px) {
        .lp-skel-nav-links {
          position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); margin: 0;
        }
      }
      @media (max-width: 1023px) and (min-width: 769px) {
        .lp-skel-contact { display: none; }
        .lp-skel-cta { display: none; }
        .lp-skel-nav-link { padding: 7px 10px; font-size: 13px; }
      }
      .lp-skel-nav-link {
        font-size: 13.5px; color: #ffffff; font-weight: 500;
        padding: 7px 13px; border-radius: 999px; white-space: nowrap;
        display: flex; align-items: center; gap: 3px;
      }
      .lp-skel-nav-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; margin-left: auto; }
      /* §SKEL-MATCH — mirrors `.lp-nav-mark`: the tile logo LEADING the bar. */
      .lp-skel-mark {
        display: block; height: 40px; width: auto; flex-shrink: 0; margin-right: 12px;
        border-radius: 10px;
        box-shadow: 0 0 0 1px rgba(255,255,255,0.22), 0 4px 14px rgba(20,0,60,0.28);
      }
      /* Wave 1.5c — `touch-action: manipulation` removes the 300 ms tap-delay
         mobile browsers add to non-double-tap-zoomable buttons.  Combined with
         `-webkit-tap-highlight-color: transparent` for a clean visual; the
         `:active` state below provides immediate visual feedback so the user
         knows the tap registered even before the LandingPage takes over. */
      .lp-skel-login, .lp-skel-contact, .lp-skel-cta, .lp-skel-demo, .lp-skel-hero-btn {
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        transition: transform 90ms ease-out, opacity 90ms ease-out;
      }
      .lp-skel-login:active, .lp-skel-contact:active, .lp-skel-cta:active,
      .lp-skel-demo:active, .lp-skel-hero-btn:active {
        transform: scale(0.97); opacity: 0.85;
      }
      /* §SKEL-MATCH — the four action pills mirror .lp-nav-contact /
         .lp-nav-login / .lp-nav-cta / .lp-nav-demo in marketingPages.ts. */
      .lp-skel-login, .lp-skel-contact, .lp-skel-cta, .lp-skel-demo {
        display: inline-flex; align-items: center; gap: 6px;
        border-radius: 999px; font-family: var(--lp-skel-font);
        font-size: 13.5px; cursor: pointer; white-space: nowrap;
      }
      .lp-skel-contact {
        background: none; border: 1px solid transparent; color: #ffffff;
        font-weight: 500; padding: 8px 13px;
      }
      .lp-skel-login {
        background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.55);
        color: #ffffff; font-weight: 600; padding: 8px 17px;
      }
      .lp-skel-cta {
        background: rgba(255,255,255,0.22); border: 1px solid rgba(255,255,255,0.34);
        color: #ffffff; font-weight: 600; padding: 8px 17px;
      }
      .lp-skel-demo {
        background: #ffffff; border: 1px solid #ffffff; color: #4A00B7;
        font-weight: 600; padding: 9px 19px;
        box-shadow: 0 6px 18px rgba(20,0,60,0.24);
      }
      /* ── PRYZM4 skeleton hero — centred gradient layout ──────────────────
         Mirrors the real LandingPage PRYZM4 centred hero: logo-block on top,
         massive heading, subtitle, pill CTAs, feature-tag strip.
         No mosaic, no white card — the gradient shell IS the background. */
      /* §SKEL-MATCH (2026-08-09) — mirrors `.lp-hero--video`. The skeleton
         does NOT request the 14 MB hero MP4: adding a video fetch before the
         JS bundle resolves would be the opposite of paint-on-first-byte. It
         paints the SAME violet field `.lp-hero-media` falls back to, at the
         SAME box, with the SAME floating panel — so when the real LandingPage
         swaps in, the only thing that changes is that the video starts. */
      .lp-skel-hero {
        flex: 0 0 auto;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        height: calc(100dvh - 64px); min-height: 420px;
        padding: 24px; text-align: center; overflow: hidden; position: relative;
        background:
          radial-gradient(ellipse 85% 90% at 28% 30%, #6600FF 0%, transparent 70%),
          radial-gradient(ellipse 75% 80% at 78% 78%, #4A00B7 0%, transparent 72%),
          #1A0640;
      }
      /* Mirrors `.lp-hero-media::after` — the scrim, so the copy sits on the
         identical value it will sit on once the video is behind it. */
      .lp-skel-hero::after {
        content: ''; position: absolute; inset: 0; pointer-events: none;
        background: linear-gradient(to bottom, rgba(26,6,64,0.46) 0%, rgba(26,6,64,0.24) 42%, rgba(26,6,64,0.58) 100%);
      }
      /* Mirrors `.lp-hero-panel`. */
      .lp-skel-hero-panel {
        position: relative; z-index: 1;
        display: flex; flex-direction: column; align-items: center;
        width: min(760px, 100%);
        padding: 34px 40px 38px; border-radius: 28px;
        background: rgba(26,6,64,0.30);
        backdrop-filter: blur(22px) saturate(1.1); -webkit-backdrop-filter: blur(22px) saturate(1.1);
        border: 1px solid rgba(255,255,255,0.22);
        box-shadow: 0 24px 70px rgba(12,0,40,0.34);
      }
      .lp-skel-hero-logo-block {
        display: flex; flex-direction: column; align-items: center; gap: 10px;
        min-height: 112px; justify-content: center; margin-bottom: 14px;
      }
      .lp-skel-hero-icon { width: 44px; height: 44px; display: block; }
      .lp-skel-hero-logoname {
        font-size: 13px; font-weight: 700; letter-spacing: 0.42em; text-indent: 0.42em;
        color: rgba(255,255,255,0.82); text-transform: uppercase; line-height: 1; margin: 0 0 20px;
      }
      /* §SKEL-MATCH (2026-05-29) — these values must match `.lp-hero-heading`
         and `.lp-hero-sub` in apps/editor/src/ui/styles/panels/marketingPages.ts
         exactly, so the swap from skeleton → real LandingPage is invisible.
         Without this, the user sees a flash of dark-purple subtitle on a
         washed-out background ("the silent wrong landing"). See memory note
         landing-skeleton-vs-real-mismatch.md. */
      .lp-skel-heading {
        font-size: clamp(30px, 6.0vw, 88px); font-weight: 800; line-height: 1.02;
        font-family: var(--lp-skel-font);
        /* White, matching `.lp-hero--video .lp-hero-heading` — the ground is
           the violet scrim now, not the pale lavender field. */
        color: #ffffff;
        margin: 0 0 20px; letter-spacing: -0.03em; max-width: none; text-transform: uppercase;
      }
      .lp-skel-sub-copy {
        font-size: clamp(14px, 1.35vw, 18px); color: rgba(255,255,255,0.92); line-height: 1.5;
        margin: 0 0 36px; max-width: 540px; font-weight: 500; letter-spacing: 0.01em;
      }
      /* Showcase plate — reserves the SAME 2560×1440 box as .lp-showcase-frame
         so nothing shifts when the real landing swaps in. The skeleton never
         requests the CDN image (it must not add a network hop before first
         paint); it paints the same token-purple surface + caption row. */
      .lp-skel-showcase {
        position: relative; width: 100%; aspect-ratio: 1600 / 442; overflow: hidden;
        background: linear-gradient(160deg, #4A00B7 0%, #6600FF 100%);
        border-top: 1px solid rgba(255,255,255,0.55);
        box-shadow: 0 -18px 48px rgba(102,0,255,0.14);
        flex-shrink: 0;
      }
      .lp-skel-showcase-caption {
        position: absolute; left: 0; right: 0; bottom: 0;
        display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
        padding: 20px 16px; color: #ffffff;
        font-size: clamp(9.5px, 0.86vw, 12.5px); font-weight: 600;
        letter-spacing: 0.18em; text-transform: uppercase;
        background: linear-gradient(to top, rgba(10,10,15,0.66) 0%, rgba(10,10,15,0.30) 55%, rgba(10,10,15,0) 100%);
      }
      .lp-skel-showcase-item {
        padding: 4px 14px; border-right: 1px solid rgba(255,255,255,0.38); line-height: 1;
      }
      .lp-skel-showcase-item:last-child { border-right: none; }
      .lp-skel-hero-ctas {
        display: flex; gap: 12px; align-items: center; justify-content: center;
        flex-wrap: wrap; margin-bottom: 8px;
      }
      /* §SKEL-MATCH — mirrors `.lp-hero--video .lp-hero-btn` (solid white,
         purple text) so the CTA does not restyle when the real page mounts. */
      .lp-skel-hero-btn {
        display: inline-flex; align-items: center; gap: 10px;
        background: #ffffff; color: #4A00B7; border: 1px solid #ffffff;
        border-radius: 999px; font-size: 15px; font-weight: 600;
        padding: 14px 30px; min-height: 48px; cursor: pointer; font-family: var(--lp-skel-font);
        letter-spacing: 0.02em; white-space: nowrap;
        box-shadow: 0 10px 30px rgba(12,0,40,0.34);
      }
      .lp-skel-hero-btn-demo {
        display: inline-flex; align-items: center; gap: 10px;
        background: rgba(255,255,255,0.18); backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        color: #fff; border: 1px solid rgba(255,255,255,0.28);
        border-radius: 999px; font-size: 15px; font-weight: 300; font-style: italic;
        padding: 13px 28px; cursor: pointer; font-family: var(--lp-skel-font);
        letter-spacing: 0.06em; white-space: nowrap;
      }
      .lp-skel-hero-tags {
        display: flex; gap: 0; align-items: center; justify-content: center;
        flex-wrap: wrap; color: rgba(90,77,122,0.72); font-size: 12.5px;
      }
      .lp-skel-hero-tag {
        padding: 0 12px; border-right: 1px solid rgba(139,92,246,0.22); line-height: 1;
      }
      .lp-skel-hero-tag:last-child { border-right: none; }
      .lp-skel-hero-tag:first-child { padding-left: 0; }

      /* ── CSS 3-D pyramid spinner — mirrors PryzmLogoSpinner.ts exactly ──
         Inlined here so the skeleton paints the same solid spinning prism
         as the real LandingPage; no flash of the old outline SVG. */
      @keyframes pryzmLogoSpin {
        from { transform: rotateX(-22deg) rotateY(0deg); }
        to   { transform: rotateX(-22deg) rotateY(-360deg); }
      }
      .lp-skel-spinner-wrap {
        display: inline-flex; align-items: center; justify-content: center;
        flex-shrink: 0; overflow: visible;
        width: 44px; height: 56px;
        filter: drop-shadow(0px 8px 16px rgba(100,60,220,0.22));
      }
      .lp-skel-spinner-scene {
        width: 36px; height: 52px;
        position: relative; overflow: visible;
        perspective: 220px; perspective-origin: 50% 42%;
      }
      .lp-skel-spinner-pyramid {
        width: 36px; height: 52px; position: relative;
        transform-style: preserve-3d;
        animation: pryzmLogoSpin 4s linear infinite;
      }
      .lp-skel-spinner-face {
        position: absolute; bottom: 0; left: 0;
        width: 36px; height: 55px;
        clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        transform-origin: 50% 100%;
        backface-visibility: hidden;
      }
      .lp-skel-spinner-face--front { background: rgba(255,255,255,0.28); transform: rotateY(0deg)   translateZ(18px) rotateX(19deg); }
      .lp-skel-spinner-face--right { background: rgba(255,255,255,0.14); transform: rotateY(90deg)  translateZ(18px) rotateX(19deg); }
      .lp-skel-spinner-face--back  { background: rgba(255,255,255,0.10); transform: rotateY(180deg) translateZ(18px) rotateX(19deg); }
      .lp-skel-spinner-face--left  { background: rgba(255,255,255,0.20); transform: rotateY(270deg) translateZ(18px) rotateX(19deg); }
      @media (prefers-reduced-motion: reduce) {
        .lp-skel-spinner-pyramid { animation-duration: 20s; }
      }
      /* Hamburger placeholder — hidden on desktop, shown on mobile.  Mirrors
         `.lp-hamburger` in marketingPages.ts (44 × 44 px touch target per
         Apple HIG / WCAG 2.5.5) so the nav layout doesn't shift when the
         real LandingPage takes over. */
      .lp-skel-hamburger {
        display: none; align-items: center; justify-content: center;
        width: 44px; height: 44px; background: none; border: none;
        border-radius: 8px; cursor: pointer; color: #ffffff;
        flex-shrink: 0; margin-left: 6px; padding: 0;
      }
      @media (max-width: 768px) {
        .lp-skel-nav { padding: 0 12px; min-height: 56px; align-items: center; }
        .lp-skel-nav-links { display: none; }
        /* §SKEL-MATCH — the CTAs hide, the actions ROW stays (it carries the mark). */
        .lp-skel-contact, .lp-skel-login, .lp-skel-cta, .lp-skel-demo { display: none; }
        .lp-skel-nav-actions { gap: 4px; }
        .lp-skel-mark { height: 34px; margin-right: 8px; }
        .lp-skel-hamburger { display: flex; }
        .lp-skel-logo-icon { width: 36px; height: 36px; }
        .lp-skel-name { font-size: 16px; letter-spacing: 3px; }
        .lp-skel-hero { height: calc(100dvh - 56px); min-height: 460px; padding: 16px 12px; }
        .lp-skel-hero-panel { width: 100%; padding: 24px 18px 26px; border-radius: 20px; }
        .lp-skel-hero-logo-block { min-height: 76px; margin-bottom: 10px; }
        .lp-skel-hero-icon { width: 54px; height: 54px; }
        .lp-skel-hero-logoname { font-size: 11px; margin-bottom: 14px; }
        .lp-skel-heading { font-size: 34px; letter-spacing: -0.02em; }
        .lp-skel-sub-copy { font-size: 14px; max-width: 100%; margin-bottom: 26px; }
        .lp-skel-showcase-caption { position: static; background: #4A00B7; padding: 12px 8px; letter-spacing: 0.10em; font-size: 9.5px; row-gap: 6px; }
        .lp-skel-showcase-item { padding: 3px 8px; }
        .lp-skel-hero-btn { padding: 14px 28px; font-size: 15px; min-height: 48px; }
        .lp-skel-hero-btn-demo { padding: 13px 24px; min-height: 48px; }
        .lp-skel-hero-ctas { flex-direction: column; width: 100%; max-width: 280px; }
        .lp-skel-hero-btn, .lp-skel-hero-btn-demo { width: 100%; text-align: center; }
      }
      /* Hide the landing skeleton for logged-in users — they will be routed
         to the project hub, not the landing page.  The external boot script
         /app-shell-boot.js (referenced below) sets `data-pryzm-auth="in"` on
         <html> from localStorage. */
      html[data-pryzm-auth="in"] [data-pryzm-skeleton="landing"] { display: none; }
    </style>
    <!--
      App-Shell boot script — EXTERNALIZED (was an inline <script> here).

      CSP REGRESSION FIX: the production CSP (server/securityHeaders.js,
      SCRIPT_SRC_PROD) grants 'self' + 'unsafe-eval' + blob: but NOT
      'unsafe-inline', so an inline boot <script> is BLOCKED in prod (it only
      ever worked on localhost, where dev CSP grants 'unsafe-inline'). The boot
      logic now lives in /app-shell-boot.js (public/app-shell-boot.js, copied
      verbatim to dist/ by Vite and served from 'self' by express.static).

      ORDERING CONTRACT — do NOT change to type="module" / defer / async:
      this is a CLASSIC SYNCHRONOUS script. It must execute here in <head>,
      BEFORE the <body> landing skeleton paints (so data-pryzm-auth hides the
      skeleton with no flash for logged-in users) and BEFORE the module entry
      <script type="module" src="/src/main.ts"> at the end of <body>.
      Because it is external + classic, the browser blocks HTML parsing until it
      is fetched and run — preserving the original inline execution timing. As a
      plain public/ asset Vite copies it verbatim (no minify/transform), so there
      is no per-build hash to keep in sync with the CSP.
    -->
    <script src="/app-shell-boot.js"></script>
  </head>
  <body>
    <!-- S70 D7 — Skip link (WCAG SC 2.4.1: bypass blocks).  First focusable element. -->
    <a href="#main" class="skip-link">Skip to main content</a>
    <!-- Platform root: landing page, auth, project hub — sits above #container -->
    <div id="platform-root" style="position:fixed;inset:0;z-index:9990;">
      <!--
        ── Landing skeleton (Wave 1.5 paint-on-first-byte) ──────────────────
        Identical visual layout to the real LandingPage's above-the-fold area.
        Removed by `LandingPage.ts` constructor (and by `PlatformRouter` for
