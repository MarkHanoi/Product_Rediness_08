# ─────────────────────────────────────────────────────────────────────────────
# fly.toml — Fly.io app config for the PRYZM editor.
#
# Canonical contract: ADR-055 (docs/02-decisions/adrs/ADR-055-one-pryzm-cloudflare-supabase.md).
# This is the bridge deployment target: Express + Vite + Socket.io in a single
# machine, with Supabase as the managed Postgres tier. No Fly Postgres.
#
# Secrets are NOT in this file. Set them with:
#   flyctl secrets set SESSION_SECRET=... SUPABASE_URL=... SUPABASE_SERVICE_ROLE_KEY=... \
#                      DATABASE_URL=... CF_WORKER_URL=... PRYZM_OWNER_EMAIL=... \
#                      PRYZM_OWNER_PASSWORD=...
# Optional (set if/when used): STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET,
# GOOGLE_CLIENT_ID, MICROSOFT_CLIENT_ID, PUBLIC_BASE_URL, ALLOWED_ORIGIN,
# OTEL_EXPORTER_OTLP_ENDPOINT, ANTHROPIC_API_KEY (fallback if CF_WORKER_URL unset).
# ─────────────────────────────────────────────────────────────────────────────

# App name is the public Fly handle (https://pryzm.fly.dev unless a custom
# domain is attached). Production-only; staging would live in a sibling
# fly.staging.toml with its own app name (e.g. `pryzm-staging`).
app = "pryzm"

# FRA = Frankfurt, Germany. Mandated by **C22 §1.3** (PII data-residency hard
# reject on bucket-region mismatch) + **C49 §1.2** (EU primary = eu-central-1)
# + **C49 §1.13** (GDPR for EU/UK customers). Paired with a Supabase project
# provisioned in `eu-central-1` (Frankfurt) so DB round-trip stays < 5ms.
#
# The strategic-docs audit (2026-06-02) flagged `iad` as a sovereignty
# violation; the user confirmed EU as canonical. See ADR-055 §5 and the
# audit report this commit lands with.
#
# Peer regions for future scale (NOT free tier — deliberate billing event):
#   lhr (London) — UK customers post-Brexit per C49 §1.13 separate isolation
#   cdg (Paris)  — FR customers if latency demands it
#   syd (Sydney) — AP customers in Phase C
# Do NOT add a US peer region without a contract amendment to C22/C49.
primary_region = "fra"

# kill_signal / kill_timeout tune graceful shutdown. SIGINT is what the prod
# shim's tini → node chain handles cleanly (Express closes Socket.io rooms,
# then drains the HTTP server). 10s is enough for in-flight save + commit.
kill_signal  = "SIGINT"
kill_timeout = "10s"

# ─── Build ──────────────────────────────────────────────────────────────────
# Use the repo-root Dockerfile (multi-stage). `flyctl deploy --remote-only`
# ships the build context to Fly's remote builder so we don't need local Docker.
[build]
  dockerfile = "Dockerfile"

# ─── Deploy strategy ──────────────────────────────────────────────────────────
# §OPS-ZERO-DOWNTIME-DEPLOY (L-133, founder-approved 2026-07-06). BLUE-GREEN:
# with a single always-on machine, a rolling deploy must STOP the old machine
# before the new one is health-passing → a ~30-90s window with NO healthy
# instance where the whole site 503s and shows `migrations_in_progress`
# (the incident 2026-07-06, docs/03-execution/analysis/INCIDENT-2026-07-06-*).
# Blue-green instead boots the NEW (green) machine, waits for it to pass the
# /api/health/ready check (SELECT 1 + boot migrations done), and ONLY THEN
# switches traffic over and stops the old (blue) one — ZERO downtime, and users
# never see the migration gate because the old machine keeps serving until the
# new one is fully ready. Runs a 2nd machine only TRANSIENTLY during the deploy
# (auto-scales back to min_machines_running=1 after; ~$0 on free tier). Peak
# ~2×pool(10)=20 Supabase connections during the brief overlap — fine, and the
# departing machine releases its pool cleanly via the shutdown drain (L-137,
# closePgPool on SIGINT). Strictly SAFER than rolling: Fly never cuts traffic to
# an unhealthy green, so a bad boot just leaves blue serving. Revert = delete
# this block (returns to the default rolling strategy).
[deploy]
  strategy = "bluegreen"

# ─── Non-secret env (visible in `flyctl config show`) ──────────────────────
# Secrets MUST go through `flyctl secrets set` (encrypted at rest, not in this file).
[env]
  NODE_ENV = "production"
  # server.js reads `process.env.PORT || 5000`; we pin it explicitly so the
  # Dockerfile EXPOSE, the HEALTHCHECK curl, and Fly's internal_port all agree.
  PORT = "5000"
  # Tells OpenTelemetry SDK + crash-reporter which environment they're in.
  # OTEL_EXPORTER_OTLP_ENDPOINT itself is a runtime secret (set separately).
  OTEL_SERVICE_NAME = "pryzm-editor"
  OTEL_RESOURCE_ATTRIBUTES = "service.name=pryzm-editor,deployment.environment=production"

  # ─── ⭐ §OBS-TRACING-COLLECTOR (L-10300) — THE SERVER TRACING SWITCH ───────
  #
  # ⛔ TRACING IS OFF IN PRODUCTION RIGHT NOW. The two variables above have been
  # here since ADR-055 and neither of them turns anything on: `OTEL_SERVICE_NAME`
  # only NAMES a provider that is never registered. MEASURED 2026-08-24 (lane
  # TELEM20): with `PRYZM_TRACING` unset, `trace.getTracer(...).startSpan()`
  # returns a `NonRecordingSpan` whose trace id is all zeros — the span is
  # DROPPED AT THE API, before any provider or exporter exists, so all 1 766
  # `span.setAttribute()` calls are no-ops too. This is not "exported to
  # nowhere"; nothing is ever constructed to export.
  #
  # ⭐ TO TURN THE SERVER HALF ON — ONE COMMAND, NO REBUILD, ~30 s machine restart:
  #
  #     flyctl secrets set PRYZM_TRACING=console -a pryzm          # → stdout
  #     flyctl logs -a pryzm | grep '\[tracing\]'                  # → proof
  #
  # or, once a collector exists (the founder's decision — C10 §2.6.5):
  #
  #     flyctl secrets set PRYZM_TRACING=otlp \
  #                        OTEL_EXPORTER_OTLP_ENDPOINT=https://<collector> \
  #                        OTEL_EXPORTER_OTLP_HEADERS='x-api-key=…' -a pryzm
  #
  # ⛔ `otlp` WITHOUT an endpoint does not degrade quietly: `initTracing()`
  # REFUSES, stays off, and logs one line naming the missing variable and the
  # `console` escape hatch. Every boot prints exactly one `[tracing] …` line
  # stating OFF / REFUSED / ON — L-392 stayed invisible for months precisely
  # because nothing ever printed `OFF`.
  #
  # ⚠ DELIBERATELY NOT SET HERE, AND THAT IS THE POINT. A `PRYZM_TRACING = ""`
  # row in this block would be an image-level env var racing a Fly secret of the
  # same name, and which of the two wins is exactly the sort of ambiguity that
  # makes an observability switch untrustworthy. `flyctl secrets set` is the
  # single, unambiguous owner of this variable. Read the boot line, not this file.
  #
  # ⚠ THIS SWITCHES THE SERVER ONLY — 1 of the repo's 347 tracer sites. The
  # other 346 are in the BROWSER, where the flag is baked at BUILD time
  # (`VITE_PRYZM_TRACING` → Dockerfile ARG → `vite.config.ts` define), so
  # flipping the browser half needs a REBUILD, not a secret. C10 §2.6.1.

# ─── HTTP edge ──────────────────────────────────────────────────────────────
[http_service]
  # Must match Dockerfile EXPOSE + PORT env.
  internal_port = 5000
  # Redirect HTTP → HTTPS at the edge. Fly issues + renews the LE cert for
  # *.fly.dev and any custom domain attached via `flyctl certs add`.
  force_https = true
  # PRODUCTION posture: never let the machine cold-start on a user request.
  # `auto_stop_machines = 'stop'` + `min_machines_running = 1` means Fly will
  # stop SURPLUS machines (e.g. during a deploy bounce) but always keep ≥1 hot.
  # On the free tier this still costs $0 because we stay under 3 shared-CPU
  # machines * 256 MB-hours; we're using 1 * 512 MB which is the documented
  # free-tier allowance for a single always-on app.
  auto_stop_machines   = "stop"
  auto_start_machines  = true
  min_machines_running = 1
  # Single process group — the editor is monolithic Express + Socket.io.
  # Multi-process (e.g. separate websocket worker) would need [processes] above.
  processes = ["app"]

  # ── Concurrency limits ────────────────────────────────────────────────────
  # Fly uses these to decide when to autoscale (when min_machines_running > 1
  # and a scaling policy is set). For a single-machine deployment they cap
  # the queue depth at the proxy. Tuned for ~50 concurrent live editors on
  # a 512MB / 1 shared-CPU box; revisit when Socket.io rooms grow past that.
  [http_service.concurrency]
    type       = "requests"
    soft_limit = 200
    hard_limit = 250

  # ── Health check (READINESS at the LB) ────────────────────────────────────
  # Different probe than the Docker HEALTHCHECK: this one talks to /api/health/ready
  # (server.js:1989) which does a SELECT 1 on the PG pool. If Supabase is down,
  # Fly will mark the instance unhealthy and stop sending traffic — which is
  # what we want, because the editor can't function without persistence.
  [[http_service.checks]]
    interval        = "30s"
    timeout         = "5s"
    # §DEPLOY-HEALTH-GRACE (2026-06-27): widened 30s → 90s. The rolling deploy
    # was intermittently failing — "WARNING The app is not listening on
    # 0.0.0.0:5000 … timeout reached waiting for health checks to pass" — because
    # the tsx loader (~100 workspace pkgs) + Express init + the SELECT-1 readiness
    # probe against a cold Supabase pool + background migrations can exceed 30s on
    # a slow boot, so the machine was killed before it ever bound :5000. The retry
    # then succeeded (boot was faster), making the deploy flap. A longer grace only
    # adds boot tolerance — steady-state checks (interval 30s) are unchanged — so
    # 90s removes the race without masking a genuinely dead instance.
    # §L-442 — Fly CAPS this at 60s and warns on anything higher ("grace period greater
    # than 1 minute; this will be lowered to 1 minute"). The old 90s was therefore a
    # no-op that read as extra tolerance we never actually had. Set to the real ceiling
    # so the config states the truth.
    grace_period    = "60s"
    method          = "GET"
    # §L-444 (2026-07-20) — DEPLOY GATE MUST NOT DEPEND ON THE DATABASE.
    # This was "/api/health/ready", which runs SELECT 1 and returns 503 whenever the
    # DB is unreachable. Fly uses these checks BOTH to gate a deploy and to route
    # traffic, so an unreachable database did not just take the app down — it made
    # every deploy fail, INCLUDING a rollback. You most need to ship when something is
    # broken, and this guaranteed you could not.
    #
    # /api/health/live is process liveness only (no DB, 200 while the process is up),
    # which is the correct question for "did this machine start?". The app already
    # degrades without PG (§SERVER-PG-DEGRADE) and can still serve the SPA, static
    # assets and every non-DB route, so a degraded instance is far better than a
    # deploy lockout.
    #
    # TRADE-OFF, stated deliberately: with /live, an instance whose DB is down STAYS in
    # rotation and serves errors on DB-backed routes rather than being pulled out.
    # That is the accepted cost of never being unable to deploy. If we later want both,
    # the answer is a separate readiness signal for routing — not putting the DB back
    # in the deploy gate.
    path            = "/api/health/live"
    protocol        = "http"
    tls_skip_verify = false

# ─── VM sizing ──────────────────────────────────────────────────────────────
# Free-tier sweet spot:
#   * cpu_kind = "shared"  → cheapest class; bursty Vite SSR + Socket.io is fine.
#   * cpus = 1             → free tier covers up to 3 shared CPUs total.
#   * memory_mb = 512      → 256 MB is too tight: tsx loader (~80MB) + Express
#                            + Socket.io + workspace ESM graph (~250MB resident)
#                            OOMs at 256. 512 leaves ~150MB headroom for
#                            concurrent uploads + IFC parsing spikes.
# When prod traffic grows past ~50 concurrent rooms, bump memory_mb to 1024
# and add a second machine in a peer region (lhr or syd) — that crosses the
# free-tier line, so it's a deliberate billing event.
# §L-442 BOOT-TIMEOUT (2026-07-20) — raised from 512 MB / 1 CPU.
# The container does NOT run precompiled JS: dist/index.cjs re-spawns server.js under
# `--import tsx`, so ~100 workspace TypeScript packages are transpiled ON EVERY COLD BOOT
# before httpServer.listen() is ever reached. On 512 MB / 1 shared CPU that exceeded Fly's
# health-check window and the machine never bound 0.0.0.0:5000 — the deploy failed with
# "The app is not listening on the expected address", with only /.fly/hallpass listening.
# It was intermittent for weeks (hence the deploy-retry loop) and became deterministic once
# a few more packages were added.
#
# This BUYS TIME; it is not the cure. The real fix is to stop transpiling at boot —
# precompile the server and its workspace deps so the runtime is plain node. Tracked as
# L-442; until then boot cost grows with every package we add, and this will recur.
# §L-442 REVERTED 2026-07-20 — back to 512 MB / 1 CPU.
# I raised this to 1024/2 to fix a "slow cold boot" that DOES NOT EXIST: measured
# boot-to-env-check is 2.9s, not 60s. The real cause was L-444 (the deploy gate
# querying a dead database). Keeping the larger VM would be paying for a diagnosis
# that was wrong. Beta budget: stay on the free-tier-friendly size until September.
[[vm]]
  size      = "shared-cpu-1x"
  cpu_kind  = "shared"
  cpus      = 1
  memory_mb = 512

# ─── Mounts ─────────────────────────────────────────────────────────────────
# Intentionally empty. The editor is stateless at the filesystem layer:
#   * DB         → Supabase Postgres (managed)
#   * Object storage → Supabase Storage / signed S3 URLs
#   * Sessions   → JWT (signed by SESSION_SECRET); no server-side session store
#   * CRDT       → Yjs documents persisted to Postgres via persistence-client
# Adding a Fly volume would defeat the "ephemeral machines" model and crosses
# the free-tier line. Don't add one without an ADR superseding ADR-055 §X.

# ─── Restart policy ─────────────────────────────────────────────────────────
# Default is "always" — keep it. The shim re-spawns server.js if it crashes,
# but a hard process death (OOM, uncaught) still needs Fly to restart the machine.
